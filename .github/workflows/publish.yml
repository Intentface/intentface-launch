# Publishes the packages to npm when a version tag is pushed:
#   bump "version" in packages/*/package.json (all three the same), commit, then
#   git tag v0.1.0 && git push origin v0.1.0
# Needs an NPM_TOKEN secret: an npm automation token with publish rights on @intentface-launch.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/*/package.json; do
            v=$(node -p "require('./$p').version")
            [ "$v" = "$tag" ] || { echo "$p is $v, tag is $tag"; exit 1; }
          done
      - run: pnpm typecheck
      - run: pnpm lint
      # Core first, then the add-ons that peer on it; prepack builds each one's dist/.
      - run: pnpm --filter @intentface-launch/core publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm --filter @intentface-launch/three --filter @intentface-launch/shaders -r publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
