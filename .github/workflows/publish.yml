# Publishes the packages to npm when a version tag is pushed:
#   bump "version" in packages/*/package.json and scripts/npx-alias/package.json
#   (all four the same, and the alias's and add-ons' ranges on core), commit, then
#   git tag v0.2.0 && git push origin v0.2.0
# Trusted publishing: no token. Each package names this repo and publish.yml as a
# trusted publisher on npmjs.com (package Settings, Trusted publishing), and npm
# signs provenance itself.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/*/package.json scripts/npx-alias/package.json; do
            v=$(node -p "require('./$p').version")
            [ "$v" = "$tag" ] || { echo "$p is $v, tag is $tag"; exit 1; }
          done
      - run: pnpm typecheck
      - run: pnpm lint
      # Core first, then the add-ons that peer on it and the alias that depends on
      # it; prepack builds each one's dist/. No workspace: ranges, so npm publishes
      # the folders as they are.
      - run: npm publish --access public
        working-directory: packages/core
      - run: npm publish --access public
        working-directory: packages/three
      - run: npm publish --access public
        working-directory: packages/shaders
      - run: npm publish --access public
        working-directory: scripts/npx-alias
